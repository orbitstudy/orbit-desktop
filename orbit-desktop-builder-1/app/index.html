<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbit</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: persistent left rail (bottom bar on phones) + one working canvas. Black and white only; hierarchy comes from type, weight and line. */
:root{
  --bg:#ffffff; --bg2:#f6f6f6; --bg3:#ebebeb; --line:#e6e6e6; --line2:#cdcdcd;
  --ink:#0a0a0a; --ink2:#525252; --ink3:#8c8c8c;
  --sh0:#0a0a0a; --sh1:#444444; --sh2:#7a7a7a; --sh3:#a8a8a8; --sh4:#d2d2d2;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --bg2:#141414; --bg3:#1f1f1f; --line:#232323; --line2:#3a3a3a;
    --ink:#f5f5f5; --ink2:#a6a6a6; --ink3:#6e6e6e;
    --sh0:#f5f5f5; --sh1:#c6c6c6; --sh2:#979797; --sh3:#686868; --sh4:#434343;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --bg2:#141414; --bg3:#1f1f1f; --line:#232323; --line2:#3a3a3a;
  --ink:#f5f5f5; --ink2:#a6a6a6; --ink3:#6e6e6e;
  --sh0:#f5f5f5; --sh1:#c6c6c6; --sh2:#979797; --sh3:#686868; --sh4:#434343;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}.ic.lg{width:24px;height:24px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.hide{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);gap:32px;height:100%}
.side{display:flex;flex-direction:column;gap:6px;padding:22px 0 18px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--serif);font-size:24px;letter-spacing:-.01em}
.brand-logo{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#0a0a0a;display:block;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink2);text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:var(--bg2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.mini{display:none;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;font-size:12.5px;text-align:left;width:100%}
.mini.on{display:flex}
.mini .dot{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
.mini b{font-family:var(--mono);font-weight:500;margin-left:auto}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);width:100%;text-align:left}
.me:hover{background:var(--bg2);color:var(--ink)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink);flex:none}
.avatar.solid{background:var(--ink);color:var(--bg)}
.main{min-height:0;overflow:auto;padding:30px 2px 64px;display:flex;flex-direction:column;scrollbar-width:thin}
.main.fit{overflow:hidden;padding-bottom:18px}
#view{flex:1;min-height:0;width:100%;max-width:1180px}
.view.fit{display:flex;flex-direction:column;min-height:0;height:100%}
.view.enter{animation:vin .3s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.page-head p{color:var(--ink2);margin-top:6px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border:1px solid var(--line2);border-radius:9px;font-weight:500;background:var(--bg);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--ink3)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid:hover{opacity:.86;background:var(--ink)}
.btn.ghost{border-color:transparent}.btn.ghost:hover{background:var(--bg2);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:11px 22px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--ink2);flex:none}
.ibtn:hover{background:var(--bg3);color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
textarea{resize:vertical;min-height:38px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.seg{display:inline-flex;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-weight:500;color:var(--ink2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
input[type=checkbox]{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink3);border-radius:5px;display:grid;place-items:center;cursor:pointer;flex:none;margin:0;background:var(--bg)}
input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
input[type=range]{appearance:none;width:100%;height:4px;border-radius:4px;background:var(--bg3);outline-offset:6px;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);cursor:pointer}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);font-weight:500}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.card.link:hover{border-color:var(--ink3);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.empty{padding:22px 10px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap}
.pill.live{border-color:var(--ink);color:var(--ink)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
.bar{height:6px;border-radius:6px;background:var(--bg3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .4s}


/* Group study launch placeholder */
.group-coming{min-height:min(590px,calc(100vh - 190px));display:grid;place-items:center;overflow:hidden;position:relative;background:var(--bg)}
.group-coming-inner{width:100%;max-width:520px;text-align:center;padding:44px 22px;display:flex;flex-direction:column;align-items:center}
.group-coming-logo{width:76px;height:76px;object-fit:contain;border-radius:19px;background:#0a0a0a;margin-bottom:24px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.group-coming .eyebrow{margin-bottom:18px}
.group-coming h2{font-size:clamp(48px,8vw,88px);line-height:.88;letter-spacing:-.075em;font-weight:600;margin:0;font-family:var(--sans)}
.group-coming h2 span{font-weight:400;color:var(--ink2)}
.group-coming-rule{width:46px;height:2px;background:var(--ink);margin:28px 0 18px}
.group-coming-copy{font-size:17px;font-weight:500;letter-spacing:-.02em}
.group-coming-note{font-size:13px;color:var(--ink3);margin-top:8px}
@media(max-width:600px){.group-coming{min-height:420px}.group-coming-inner{padding:32px 14px}.group-coming-logo{width:64px;height:64px}}

/* dashboard */
.hello{margin-bottom:26px}
.hello .eyebrow{margin-bottom:10px}
.hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,76px);line-height:1;letter-spacing:-.02em}
.hello h1 em{font-style:italic;cursor:pointer;border-bottom:1px solid transparent}
.hello h1 em:hover{border-bottom-color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.stack{display:grid;gap:16px;align-content:start}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wotd{display:flex;flex-direction:column;gap:12px;min-height:300px;position:relative}
.wotd .word{font-family:var(--serif);font-size:clamp(44px,6vw,68px);line-height:1;letter-spacing:-.02em;word-break:break-word}
.wotd .pron{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.wotd .pos{font-style:italic;font-family:var(--serif);font-size:18px;color:var(--ink2)}
.wotd .def{font-size:17px;line-height:1.45;max-width:46ch}
.wotd .ex{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink2);max-width:46ch;border-left:2px solid var(--ink);padding-left:14px;margin-top:auto}
.stat-n{font-family:var(--serif);font-size:64px;line-height:.95;letter-spacing:-.02em}
.stat-n small{font-family:var(--sans);font-size:13px;color:var(--ink2);letter-spacing:0;margin-left:6px}
.week-dots{display:flex;gap:6px;margin-top:14px}
.week-dots span{flex:1;text-align:center;font-size:10.5px;color:var(--ink3)}
.week-dots i{display:block;height:8px;border-radius:4px;background:var(--bg3);margin-bottom:5px}
.week-dots i.on{background:var(--ink)}
.week-dots span.t{color:var(--ink);font-weight:600}
.cl-add{display:flex;gap:8px;margin-bottom:10px}
.cl-list{display:flex;flex-direction:column;max-height:300px;overflow:auto;margin:0 -6px;padding:0 6px}
.cl-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.cl-item:last-child{border-bottom:0}
.cl-item .t{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
.cl-item.done .t{text-decoration:line-through;color:var(--ink3)}
.cl-item .x{opacity:0;transition:opacity .15s}
.cl-item:hover .x,.cl-item:focus-within .x{opacity:1}
@media (hover:none){.cl-item .x{opacity:1}}
.cl-item input[type=text]{padding:4px 8px}
.exam{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.exam:last-child{border-bottom:0}
.exam .n{font-family:var(--serif);font-size:38px;line-height:1;min-width:76px;letter-spacing:-.02em}
.exam .n small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.exam.past{opacity:.45}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;text-align:left;transition:all .15s;background:var(--bg)}
.tile:hover{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-2px)}
.tile:hover .faint{color:inherit;opacity:.65}
.tile b{font-weight:600;display:block}
.sched{display:flex;flex-direction:column}
.sched .it{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sched .it:last-child{border-bottom:0}
.sched .tm{font-family:var(--mono);font-size:12px;color:var(--ink2);min-width:74px}

/* calendar */
.cal-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-top h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.01em;margin-right:6px;min-width:0}
.cal-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;flex:1;min-height:0}
.cal-side{width:216px;display:flex;flex-direction:column;gap:18px}
@media (max-width:1100px){.cal-side{display:none}.cal-wrap{grid-template-columns:minmax(0,1fr)}}
.minical .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}
.minical .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.minical .mg i{font-style:normal;color:var(--ink3);font-size:10.5px;padding:3px 0}
.minical .mg button{aspect-ratio:1;border-radius:50%;color:var(--ink);font-size:12px}
.minical .mg button.o{color:var(--ink3)}
.minical .mg button:hover{background:var(--bg3)}
.minical .mg button.sel{background:var(--bg3);font-weight:700}
.minical .mg button.tod{background:var(--ink);color:var(--bg)}
.cal-main{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.cal-scroll{overflow:auto;flex:1;min-height:0;position:relative;scrollbar-width:thin}
.cal-head{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr));background:var(--bg);border-bottom:1px solid var(--line)}
.cal-head .dh{padding:9px 6px 8px;text-align:center;border-left:1px solid var(--line);cursor:pointer}
.cal-head .dh small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.cal-head .dh b{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:99px;font-size:15px;font-weight:600;margin-top:2px}
.cal-head .dh.today b{background:var(--ink);color:var(--bg)}
.cal-head .dh:hover b{background:var(--bg3)}.cal-head .dh.today:hover b{background:var(--ink)}
.cal-body{position:relative;display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr));--hh:52px;touch-action:pan-y}
.cal-times{position:relative}
.cal-times span{position:absolute;right:9px;transform:translateY(-50%);font-size:10.5px;color:var(--ink3);white-space:nowrap}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh);cursor:cell}
.cal-col.today{background-color:var(--bg2)}
.ev{position:absolute;border-radius:7px;padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;border:1px solid var(--ink);z-index:2;transition:box-shadow .15s}
.ev:hover{box-shadow:var(--shadow)}
.ev b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{display:block;opacity:.75;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.short{display:flex;gap:6px;align-items:baseline}
.ev.short span{display:inline}
.t-solid{background:var(--ink);color:var(--bg)}
.t-soft{background:var(--bg3);color:var(--ink);border-color:var(--bg3)}
.t-line{background:var(--bg);color:var(--ink);border:1.5px solid var(--ink)}
.t-hatch{color:var(--ink);background:repeating-linear-gradient(135deg,var(--bg3) 0 5px,var(--bg) 5px 10px);border-color:var(--line2)}
.ev-h{position:absolute;left:0;right:0;height:8px;cursor:ns-resize;z-index:3}
.ev-h.top{top:0}.ev-h.bot{bottom:0}
.ev.ghost{pointer-events:none;z-index:8;box-shadow:var(--shadow)}
.ev.dragging{opacity:.3}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--ink);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px}
.mhead{padding:9px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.mcell{min-height:104px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:cell;min-width:0}
.mcell:nth-child(7n+1){border-left:0}
.mcell.o{background:var(--bg2)}
.mcell .dn{align-self:flex-start;min-width:24px;height:24px;display:grid;place-items:center;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.mcell .dn:hover{background:var(--bg3)}
.mcell.tod .dn{background:var(--ink);color:var(--bg)}
.chip{display:block;width:100%;text-align:left;padding:2px 6px;border-radius:5px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--ink)}
.more{font-size:11px;color:var(--ink3);padding:0 4px}
.modal-bg{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow),0 24px 60px rgba(0,0,0,.18);width:min(460px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(600px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
.modal h2{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.01em;margin-bottom:14px}

.form{display:grid;gap:14px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-b{padding:4px 10px;border:1px solid var(--line2);border-radius:99px;font-size:12.5px;color:var(--ink2)}

/* flashcards */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.setcard{display:flex;flex-direction:column;gap:6px;min-height:150px;text-align:left}

.setcard.new{border-style:dashed;align-items:center;justify-content:center;color:var(--ink2);gap:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.mode{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;text-align:left;transition:all .15s}

.terms{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.term{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:18px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:start}

.stage{max-width:760px;margin:0 auto}
.flip{perspective:1400px;cursor:pointer}
.flip-in{position:relative;height:clamp(250px,42vh,380px);transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.flip.nt .flip-in{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line2);border-radius:20px;display:grid;place-items:center;padding:30px;text-align:center;font-size:clamp(20px,3.2vw,30px);line-height:1.3;background:var(--bg);overflow:auto;box-shadow:var(--shadow);overflow-wrap:anywhere}
.face.back{transform:rotateY(180deg);background:var(--ink);color:var(--bg);border-color:var(--ink)}

.prog{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.prog .bar{flex:1}
.ctrl{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.q{font-family:var(--serif);font-size:clamp(26px,4vw,38px);line-height:1.15;text-align:center;margin:16px 0 26px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border:1px solid var(--line2);border-radius:12px;text-align:left;transition:all .15s;overflow-wrap:anywhere}
.opt:hover{border-color:var(--ink)}
.opt.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.no{text-decoration:line-through;color:var(--ink3);border-style:dashed}

.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mt{min-height:96px;padding:12px;border:1px solid var(--line2);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13.5px;transition:all .2s;overflow-wrap:anywhere}
.mt:hover{border-color:var(--ink)}
.mt.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.fc-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1.6fr) 30px;gap:10px;align-items:start;margin-bottom:10px}
.fc-row .n{color:var(--ink3);font-family:var(--mono);font-size:12px;padding-top:11px;text-align:center}
.big{font-family:var(--serif);font-size:56px;letter-spacing:-.02em;line-height:1}

/* timer */
.t-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.subj{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:99px;font-weight:500;transition:all .15s}

.ring{position:relative;width:min(100%,300px);aspect-ratio:1;margin:18px auto 10px}

.t-ctrl{display:flex;justify-content:center;gap:10px;align-items:center}

.welcome{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px}

<script>
/* ---- js1-core ---- */
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ic = (n, cls = '') => '<svg class="ic ' + cls + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const shuffled = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
function fmtHMS(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s); }
function fmtDur(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); if (h) return h + 'h ' + pad(m) + 'm'; if (m) return m + 'm'; return sec > 0 ? '<1m' : '0m'; }
function fmtClock(min) {
  min = clamp(Math.round(min), 0, 1440);
  const h = Math.floor(min / 60) % 24, m = min % 60;
  if (S.prefs.h24) return pad(min === 1440 ? 24 : h) + ':' + pad(m);
  const ap = (min === 1440 || h < 12) ? 'AM' : 'PM'; const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + pad(m) + ' ' + ap;
}
function fmtClockShort(min) {
  if (S.prefs.h24) return fmtClock(min);
  const h = Math.floor(min / 60) % 24, m = min % 60; const ap = (min === 1440 || h < 12) ? 'AM' : 'PM'; const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + (m ? ':' + pad(m) : '') + ' ' + ap;
}
function parseClock(s) {
  s = String(s).trim().toLowerCase().replace(/\s+/g, ''); if (!s) return null;
  let ap = null; const mm = s.match(/(am|pm|a|p)$/);
  if (mm) { ap = mm[1][0]; s = s.slice(0, -mm[1].length); }
  let h, mi;
  if (/^\d{1,2}$/.test(s)) { h = +s; mi = 0; }
  else if (/^\d{3,4}$/.test(s)) { h = +s.slice(0, -2); mi = +s.slice(-2); }
  else { const t = s.match(/^(\d{1,2})[:.h](\d{1,2})$/); if (!t) return null; h = +t[1]; mi = +t[2]; }
  if (mi > 59) return null;

/* ================= state ================= */
const LS_KEY = 'studyhub.v1';
function seedSet() {
  const c = (t, d) => ({ id: uid(), t, d, star: false });
  return { id: uid(), title: 'Sample: Cell biology', desc: 'An example set. Edit it or delete it.', created: Date.now(), studied: 0, best: 0, cards: [
    c('Mitochondria', 'Organelle that produces most of the cell’s ATP'), c('Ribosome', 'Site of protein synthesis'), c('Nucleus', 'Contains the cell’s DNA'),
    c('Golgi apparatus', 'Modifies, sorts and packages proteins for transport'), c('Lysosome', 'Contains enzymes that break down waste'),
    c('Cell membrane', 'Phospholipid bilayer controlling what enters and leaves'), c('Chloroplast', 'Site of photosynthesis in plant cells'), c('Endoplasmic reticulum', 'Network of membranes involved in protein and lipid synthesis') ] };
}
function defaults() {
  return {
    v: 1, _ts: 0, name: '',
    prefs: { theme: 'system', h24: false, weekStart: 1, calView: 'week' },
    events: [], sets: [seedSet()],
    subjects: [{ id: 's1', name: 'Maths', shade: 0 }, { id: 's2', name: 'English', shade: 2 }, { id: 's3', name: 'Science', shade: 3 }],
    logs: {},

    timer: { mode: 'stopwatch', running: false, phase: 'study', subjectId: 's1', lastTick: 0, phaseEndsAt: 0, remaining: 25 * 60000, cycle: 0, session: 0 },
    checklist: [{ id: uid(), text: 'Plan this week’s study', done: false }, { id: uid(), text: 'Make a flashcard set', done: false }],
    exams: [], streak: { goal: 25, checkins: {} },

}
function merge(base, saved) {
  const out = Object.assign({}, base);
  for (const k in saved) {
    const b = base[k], v = saved[k];

/* ================= cloud sync (optional, per person) ================= */
const cloud = {
  ok: false, on: false, id: null, db: null, t: 0, last: 0, pending: false,
  async init() {
    try {
      if (!(window.claude && window.claude.use)) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;

      if (!id) return;

  },
  doc() { return this.db.collection('data/users/' + this.id).doc('state'); },
  async pull() {

  dirty() {

      const json = JSON.stringify(rest);
      if (json.length > 240000) return;
      await this.doc().set({ ts: S._ts, json });
      this.last = Date.now();
    } catch (e) { if (e && e.code === 'invalid_argument') this.on = false; }
  }
};

/* ================= study stats (shared) ================= */
function totalOn(k) { const l = S.logs[k]; if (!l) return 0; let t = 0; for (const s in l) t += l[s]; return t; }
function subjName(id) { const s = S.subjects.find(x => x.id === id); return s ? s.name : 'Removed subject'; }
function subjShade(id) { const s = S.subjects.find(x => x.id === id); return s ? s.shade : 4; }
function weekStartDate(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const diff = (x.getDay() - S.prefs.weekStart + 7) % 7; return addDays(x, -diff); }
function rollingTotal(days) { let t = 0; const now = new Date(); for (let i = 0; i < days; i++) t += totalOn(dkey(addDays(now, -i))); return t; }
function dayDone(k) { return totalOn(k) >= S.streak.goal * 60 || !!S.streak.checkins[k]; }
function streakNow() {
  let d = new Date(); if (!dayDone(dkey(d))) d = addDays(d, -1);
  let n = 0; while (dayDone(dkey(d))) { n++; d = addDays(d, -1); if (n > 5000) break; }
  return n;
}
function streakBest() {
  const keys = new Set(Object.keys(S.logs).filter(k => totalOn(k) >= S.streak.goal * 60).concat(Object.keys(S.streak.checkins).filter(k => S.streak.checkins[k])));
  const arr = Array.from(keys).sort(); let best = 0, run = 0, prev = null;
  arr.forEach(k => { const d = fromKey(k); if (prev && Math.round((d - prev) / 864e5) === 1) run++; else run = 1; if (run > best) best = run; prev = d; });
  return Math.max(best, streakNow());
}

function sydneyNow() {
  const f = new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const p = {}; f.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { y: +p.year, m: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, s: +p.second };
}
function wordOfToday() {
  const t = sydneyNow(); const day = Math.floor(Date.UTC(t.y, t.m - 1, t.d) / 864e5);
  const w = WORDS[((day % WORDS.length) + WORDS.length) % WORDS.length];
  return { w, secsLeft: 86400 - (t.h * 3600 + t.mi * 60 + t.s) };
}

function cdParts(at) {
  const diff = new Date(at).getTime() - Date.now();
  if (isNaN(diff)) return ['–', ''];
  if (diff <= 0) return ['Done', 'finished'];
  const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5), m = Math.floor(diff % 36e5 / 6e4);
  if (d >= 1) return [String(d), d === 1 ? 'day' : 'days'];
  if (h >= 1) return [h + 'h ' + pad(m) + 'm', 'left'];
  return [m + 'm', 'left'];
}

const TONES = ['solid', 'soft', 'line', 'hatch'];

function calDays() {

  if (v === 'day') return [new Date(cal.date.getFullYear(), cal.date.getMonth(), cal.date.getDate())];
  const s = weekStartDate(cal.date); return Array.from({ length: 7 }, (_, i) => addDays(s, i));
}
function calTitle() {

  if (v === 'month') return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  if (v === 'day') return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  const ds = calDays(), a = ds[0], b = ds[6];
  return a.getMonth() === b.getMonth() ? MONTHS[a.getMonth()] + ' ' + a.getFullYear() : MONTHS[a.getMonth()].slice(0, 3) + ' – ' + MONTHS[b.getMonth()].slice(0, 3) + ' ' + b.getFullYear();

    if (!cluster.length) return; const ends = [];
    cluster.forEach(e => { let c = ends.findIndex(x => x <= e.start); if (c < 0) { c = ends.length; ends.push(e.end); } else ends[c] = e.end; res[e.id] = { col: c }; });
    cluster.forEach(e => { res[e.id].cols = ends.length; }); cluster = [];
  };
  sorted.forEach(e => { if (cluster.length && e.start >= clusterEnd) { flushC(); clusterEnd = 0; } cluster.push(e); clusterEnd = Math.max(clusterEnd, e.end); });

}

/* drag to create / move / resize */
function bindCalDrag(body) {
  if (!body) return;
  const cols = $$('.cal-col', body);
  const colAt = x => cols.find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; }) || null;
  const rawMin = (col, y) => (y - col.getBoundingClientRect().top) / HH * 60;
  const snapF = m => clamp(Math.floor(m / SNAP) * SNAP, 0, 1440 - SNAP);
  const snapR = m => clamp(Math.round(m / SNAP) * SNAP, 0, 1440);
  let drag = null, ghost = null;

  const paintGhost = (col, start, end, title, tone) => {
    if (!ghost) { ghost = document.createElement('div'); ghost.className = 'ev ghost t-' + (tone || 'solid'); }
    if (ghost.parentNode !== col) col.appendChild(ghost);
    ghost.style.top = (start / 60 * HH + 1) + 'px'; ghost.style.height = Math.max(14, (end - start) / 60 * HH - 2) + 'px'; ghost.style.left = '2px'; ghost.style.width = 'calc(100% - 4px)';
    ghost.innerHTML = '<b>' + esc(title || 'New event') + '</b><span>' + fmtClockShort(start) + ' – ' + fmtClockShort(end) + '</span>';
  };
  const clearGhost = () => { if (ghost) { ghost.remove(); ghost = null; } };

  body.addEventListener('pointerdown', e => {
    cal.lastPT = e.pointerType;
    if (e.pointerType === 'touch' || e.button !== 0) return;
    const col = e.target.closest('.cal-col'); if (!col) return;
    const evEl = e.target.closest('.ev');
    if (evEl) {
      const ev = S.events.find(x => x.id === evEl.dataset.id); if (!ev) return;
      const handle = e.target.closest('.ev-h');
      const mode = handle ? (handle.classList.contains('top') ? 'rtop' : 'rbot') : 'move';
      drag = { mode, ev, col, orig: { start: ev.start, end: ev.end, date: ev.date }, grab: rawMin(col, e.clientY) - ev.start, x0: e.clientX, y0: e.clientY, moved: false, el: evEl, start: ev.start, end: ev.end, date: ev.date };
    } else {
      const m = snapF(rawMin(col, e.clientY));
      drag = { mode: 'create', col, anchor: m, x0: e.clientX, y0: e.clientY, moved: false, start: m, end: m + 60, date: col.dataset.date };
    }
    e.preventDefault();
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp, { once: true }); window.addEventListener('pointercancel', onCancel, { once: true });
  });
  function onMove(e) {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 4) return;
    drag.moved = true;
    const colUnder = colAt(e.clientX) || drag.col;
    if (drag.mode === 'create') {
      const m = snapF(rawMin(drag.col, e.clientY));
      drag.start = Math.min(drag.anchor, m); drag.end = Math.max(drag.anchor, m) + SNAP;
      paintGhost(drag.col, drag.start, drag.end);
    } else if (drag.mode === 'move') {
      const dur = drag.orig.end - drag.orig.start;
      let s = snapR(rawMin(colUnder, e.clientY) - drag.grab); s = clamp(s, 0, 1440 - dur);
      drag.start = s; drag.end = s + dur; drag.date = colUnder.dataset.date; drag.el.classList.add('dragging');
      paintGhost(colUnder, drag.start, drag.end, drag.ev.title, drag.ev.tone);
    } else if (drag.mode === 'rbot') {
      drag.end = clamp(snapR(rawMin(drag.col, e.clientY)), drag.start + SNAP, 1440); drag.el.classList.add('dragging');
      paintGhost(drag.col, drag.start, drag.end, drag.ev.title, drag.ev.tone);
    } else if (drag.mode === 'rtop') {
      drag.start = clamp(snapR(rawMin(drag.col, e.clientY)), 0, drag.end - SNAP); drag.el.classList.add('dragging');
      paintGhost(drag.col, drag.start, drag.end, drag.ev.title, drag.ev.tone);
    }
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    const d = drag; drag = null; clearGhost(); if (!d) return;
    if (d.el) d.el.classList.remove('dragging');
    if (!d.moved) {
      if (d.mode === 'create') openEvent({ date: d.date, start: d.start, end: Math.min(1440, d.start + 60) });
      else openEvent(d.ev);
      cal.suppress = true; setTimeout(() => { cal.suppress = false; }, 0); return;
    }
    cal.suppress = true; setTimeout(() => { cal.suppress = false; }, 0);
    if (d.mode === 'create') openEvent({ date: d.date, start: d.start, end: d.end });
    else { d.ev.start = d.start; d.ev.end = d.end; d.ev.date = d.date; save(); rerender(); }
  }
  function onCancel() { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); if (drag && drag.el) drag.el.classList.remove('dragging'); drag = null; clearGhost(); }

  // touch + keyboard-free taps: open editor on tap
  body.addEventListener('click', e => {
    if (cal.suppress || cal.lastPT !== 'touch') return;
    const evEl = e.target.closest('.ev');
    if (evEl) { const ev = S.events.find(x => x.id === evEl.dataset.id); if (ev) openEvent(ev); return; }
    const col = e.target.closest('.cal-col'); if (!col) return;
    const m = snapF(rawMin(col, e.clientY)); openEvent({ date: col.dataset.date, start: m, end: Math.min(1440, m + 60) });
  });
  body.addEventListener('dblclick', e => e.preventDefault());
}

/* event editor */
function openEvent(init) {
  const isNew = !init.id;
  const ed = Object.assign({ id: null, title: '', date: dkey(), start: 540, end: 600, tone: 'solid', notes: '' }, init);
  const html = '<div class="form"><input type="text" class="title-in" id="ev-title" placeholder="Event title" maxlength="80" value="' + esc(ed.title) + '" aria-label="Event title">' +
    '<label class="f">Date<input type="date" id="ev-date" value="' + ed.date + '"></label>' +
    '<div class="two"><div class="f">Starts<div class="stepper"><button class="ibtn" type="button" data-s="sm" aria-label="Start 15 minutes earlier">' + ic('minus', 'sm') + '</button><input type="text" id="ev-start" aria-label="Start time"><button class="ibtn" type="button" data-s="sp" aria-label="Start 15 minutes later">' + ic('plus', 'sm') + '</button></div></div>' +
    '<div class="f">Ends<div class="stepper"><button class="ibtn" type="button" data-s="em" aria-label="End 15 minutes earlier">' + ic('minus', 'sm') + '</button><input type="text" id="ev-end" aria-label="End time"><button class="ibtn" type="button" data-s="ep" aria-label="End 15 minutes later">' + ic('plus', 'sm') + '</button></div></div></div>' +
    '<div class="f">Length <span id="ev-dur" class="mono" style="color:var(--ink)"></span><div class="chips" id="ev-chips">' + [15, 30, 45, 60, 90, 120].map(d => '<button type="button" class="chip-b" data-d="' + d + '">' + fmtDur2(d) + '</button>').join('') + '</div></div>' +
    '<div class="f">Style<div class="tones" id="ev-tones">' + TONES.map(t => '<button type="button" class="ev t-' + t + '" style="position:relative" data-t="' + t + '" aria-label="' + t + ' style"></button>').join('') + '</div></div>' +
    '<label class="f">Notes<textarea id="ev-notes" rows="2" maxlength="400" placeholder="Optional">' + esc(ed.notes) + '</textarea></label></div>' +
    '<div class="foot">' + (!isNew ? '<button class="btn l" type="button" id="ev-del">' + ic('trash', 'sm') + ' Delete</button>' : '') + '<button class="btn" type="button" id="ev-cancel">Cancel</button><button class="btn solid" type="button" id="ev-save">Save</button></div>';
  const m = openModal(html, { cls: 'ev-modal' });
  const q = s => m.el.querySelector(s);
  const paint = () => {
    q('#ev-start').value = fmtClock(ed.start); q('#ev-end').value = fmtClock(ed.end); q('#ev-dur').textContent = fmtDur2(ed.end - ed.start);
    $$('#ev-chips button', m.el).forEach(b => b.classList.toggle('on', +b.dataset.d === ed.end - ed.start));
    $$('#ev-tones button', m.el).forEach(b => b.classList.toggle('on', b.dataset.t === ed.tone));
  };
  const setStart = (s) => { const dur = ed.end - ed.start; s = clamp(s, 0, 1440 - SNAP); ed.start = s; ed.end = Math.min(1440, s + dur); if (ed.end <= ed.start) ed.end = Math.min(1440, ed.start + SNAP); paint(); };
  const setEnd = (e2) => { ed.end = clamp(e2, ed.start + SNAP, 1440); paint(); };
  q('#ev-start').addEventListener('change', e => { const v = parseClock(e.target.value); if (v == null || v >= 1440) { toast('Try a time like 9:30 am or 14:15'); paint(); return; } setStart(v); });
  q('#ev-end').addEventListener('change', e => { const v = parseClock(e.target.value); if (v == null || v <= ed.start) { toast('End time must be after the start'); paint(); return; } setEnd(v); });
  m.el.addEventListener('click', e => {
    const s = e.target.closest('[data-s]'); if (s) { const k = s.dataset.s; if (k === 'sm') setStart(ed.start - SNAP); if (k === 'sp') setStart(ed.start + SNAP); if (k === 'em') setEnd(ed.end - SNAP); if (k === 'ep') setEnd(ed.end + SNAP); return; }
    const d = e.target.closest('[data-d]'); if (d) { setEnd(ed.start + (+d.dataset.d)); return; }
    const t = e.target.closest('[data-t]'); if (t) { ed.tone = t.dataset.t; paint(); }
  });
  q('#ev-cancel').onclick = () => m.close();
  if (!isNew) q('#ev-del').onclick = () => { S.events = S.events.filter(x => x.id !== ed.id); save(); m.close(); rerender(); };
  const submit = () => {
    ed.title = q('#ev-title').value.trim(); ed.notes = q('#ev-notes').value.trim(); ed.date = q('#ev-date').value || ed.date;
    const rec = { id: ed.id || uid(), title: ed.title, date: ed.date, start: ed.start, end: ed.end, tone: ed.tone, notes: ed.notes };
    if (isNew) S.events.push(rec); else { const i = S.events.findIndex(x => x.id === ed.id); if (i >= 0) S.events[i] = rec; }
    save(); m.close(); if (cur === 'calendar') { cal.date = fromKey(rec.date); rerender(); } else if (cur === 'home') paintSched();
  };
  q('#ev-save').onclick = submit;
  m.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'date') { e.preventDefault(); e.target.blur(); submit(); } });
  paint();
  return m;
}

/* ================= study timer ================= */
const PHASES = { study: 'Focus', small: 'Small break', big: 'Big break' };

function credit(ms, ts) {
  const k = dkey(new Date(ts)), l = S.logs[k] || (S.logs[k] = {}), id = S.timer.subjectId;
  l[id] = (l[id] || 0) + ms / 1000; S.timer.session += ms / 1000;
}
function beep() {
  try {
    const ac = audio(); if (!ac) return; const g = ac.createGain(); g.connect(ac.destination); g.gain.value = 0;
    [0, .22, .44].forEach((o, i) => { const os = ac.createOscillator(); os.type = 'sine'; os.frequency.value = i === 2 ? 1040 : 780; os.connect(g); const t0 = ac.currentTime + o; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.25, t0 + .02); g.gain.linearRampToValueAtTime(0, t0 + .18); os.start(t0); os.stop(t0 + .2); });
  } catch (e) { }
}
function advance(at, natural) {

  const dur = curDur(t.phase); t.remaining = dur;
  if (t.running) { t.phaseEndsAt = at + dur; t.lastTick = at; }
  if (natural) { beep(); toast(t.phase === 'study' ? 'Break over. Back to focus.' : (t.phase === 'big' ? 'Nice work. Take a big break.' : 'Take a small break.')); if (!p.auto) { t.running = false; } }
  save(); groupPublish();
  if (cur === 'timer') rerender(); else if (cur === 'home') { paintTodayCard(); }
}
function timerTick() {
  const t = S.timer; if (!t.running) return;
  const now = Date.now();
  for (let guard = 0; guard < 24; guard++) {
    const end = t.mode === 'pomodoro' ? t.phaseEndsAt : Infinity, upto = Math.min(now, end), dt = upto - t.lastTick;
    if (dt > 0) { if (t.mode === 'stopwatch' || t.phase === 'study') credit(Math.min(dt, 5 * 60000), upto); t.lastTick = upto; }
    if (t.mode === 'pomodoro' && now >= end) { advance(end, true); if (!t.running) break; } else break;
  }

}
function timerStart() {

}

/* ================= group study (shared, live) ================= */
const G = { code: '', name: '', members: {}, seen: {}, state: 'idle', tab: 'today', wq: Promise.resolve(), pubT: 0, unM: null, unG: null, readOnly: false };
const STALE_MS = 120000;
const validCode = c => /^[A-Z0-9]{6}$/.test(c);
function genCode() { const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function weekTotal() { const ws = weekStartDate(new Date()), today = dkey(); let t = 0; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (dkey(d) > today) break; t += totalOn(dkey(d)); } return t; }
function myPayload() {
  const t = S.timer, studying = t.running && (t.mode === 'stopwatch' || t.phase === 'study'), status = studying ? 'studying' : (t.running ? 'break' : 'idle');
  return { name: S.name || 'Student', status, subject: studying ? subjName(t.subjectId) : '', today: Math.round(totalOn(dkey())), week: Math.round(weekTotal()), streak: streakNow(), seq: Date.now() };
}
function groupPublish() { if (!G.code || !cloud.ok || G.readOnly) return; clearTimeout(G.pubT); G.pubT = setTimeout(doPublish, 350); }
function doPublish() {
  if (!G.code || !cloud.ok) return;
  const code = G.code, payload = myPayload();
  G.wq = G.wq.then(() => cloud.db.doc('groups/' + code + '/members/' + cloud.id).set(payload)).catch(e => { if (e && e.code === 'invalid_argument') { G.readOnly = true; groupChanged(); } });
}
setInterval(() => { if (G.code && S.timer.running) doPublish(); }, 30000);

function mState(m) { const age = Date.now() - m.arr; const live = !m.off && age < STALE_MS; return live ? m.d.status : 'idle'; }
function mSecs(id, m, field) {
  if (id === cloud.id) return field === 'today' ? totalOn(dkey()) : weekTotal();
  const base = +m.d[field] || 0; return mState(m) === 'studying' ? base + Math.min(STALE_MS, Date.now() - m.arr) / 1000 : base;
}
function mStatusText(id, m) {
  const st = id === cloud.id ? (S.timer.running ? ((S.timer.mode === 'stopwatch' || S.timer.phase === 'study') ? 'studying' : 'break') : 'idle') : mState(m);
  const subj = id === cloud.id ? subjName(S.timer.subjectId) : (m.d.subject || '');
  if (st === 'studying') return ['live', 'Studying' + (subj ? ' · ' + subj : '')];
  if (st === 'break') return ['', 'On a break'];
  return ['', 'Not studying'];
}
function groupLiveCount() { let n = 0; for (const id in G.members) if (id !== cloud.id && mState(G.members[id]) === 'studying') n++; return n; }
function memberList(field) {
  const out = Object.keys(G.members).map(id => ({ id, m: G.members[id], v: mSecs(id, G.members[id], field) }));
  if (cloud.id && !G.members[cloud.id] && G.code) out.push({ id: cloud.id, m: { d: myPayload(), arr: Date.now(), off: false }, v: mSecs(cloud.id, null, field) });
  return out.sort((a, b) => b.v - a.v);
}
function whoRow(r, i, max, field) {

/* subscribe / create / join / leave */
function groupUnsub() { if (G.unM) { try { G.unM(); } catch (e) { } G.unM = null; } if (G.unG) { try { G.unG(); } catch (e) { } G.unG = null; } }
function groupSubscribe(code) {
  groupUnsub(); G.code = code; G.members = {}; G.seen = {};
  G.unM = cloud.db.collection('groups/' + code + '/members').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed') { delete G.members[id]; delete G.seen[id]; return; }
      const d = ch.doc.data() || {}; const first = !G.seen[id]; G.seen[id] = true;
      G.members[id] = { d, arr: Date.now(), off: first && (Date.now() - (d.seq || 0)) > 10 * 60 * 1000 };
    });
    G.state = 'ready'; groupChanged();
  }, () => { G.state = 'error'; groupChanged(); });
  G.unG = cloud.db.doc('groups/' + code).onSnapshot(s => { G.name = s.exists ? (s.data().name || 'Study group') : G.name; groupChanged(); }, () => { });
}
async function groupJoin(code, silent) {
  if (!cloud.ok) return false; code = String(code || '').toUpperCase().trim();
  if (!validCode(code)) { if (!silent) toast('Codes are 6 letters or numbers'); return false; }
  G.state = 'loading'; groupChanged();
  try {
    const snap = await cloud.db.doc('groups/' + code).get();
    if (!snap.exists) { G.state = 'idle'; if (!silent) toast('No group found with that code'); else { S.group.code = ''; save(); } groupChanged(); return false; }
    G.name = snap.data().name || 'Study group'; S.group.code = code;
    S.group.history = [{ code, name: G.name }].concat((S.group.history || []).filter(h => h.code !== code)).slice(0, 5); save();
    groupSubscribe(code); doPublish(); return true;
  } catch (e) { G.state = 'error'; if (!silent) toast('Could not reach that group. Try again.'); groupChanged(); return false; }
}
async function groupCreate(name) {
  if (!cloud.ok) return;
  name = (name || '').trim().slice(0, 40) || 'Study group';
  try {
    for (let i = 0; i < 6; i++) {
      const code = genCode(), ref = cloud.db.doc('groups/' + code), s = await ref.get();
      if (!s.exists) { await ref.set({ name, owner: cloud.id, created: Date.now() }); await groupJoin(code); return; }
    }
    toast('Could not make a code. Try again.');
  } catch (e) { G.readOnly = e && e.code === 'invalid_argument'; toast(G.readOnly ? 'You need Contributor access to create a group' : 'Could not create the group. Try again.'); groupChanged(); }
}
async function groupLeave() {
  const code = G.code; groupUnsub(); clearTimeout(G.pubT); G.members = {}; G.seen = {}; G.code = ''; G.name = ''; G.state = 'idle'; S.group.code = ''; save();
  if (code && cloud.ok) { try { await cloud.db.doc('groups/' + code + '/members/' + cloud.id).delete(); } catch (e) { } }
  groupChanged();
}

const SOUNDS = [
  ['rain', 'Rain', 'rain', 'Steady rainfall'], ['thunder', 'Thunder', 'bolt', 'Distant rumbles'], ['wind', 'Wind', 'wind', 'Soft gusts'], ['waves', 'Ocean', 'waves', 'Rolling surf'],
  ['stream', 'Stream', 'drop', 'Babbling water'], ['fire', 'Fireplace', 'fire', 'Crackling logs'], ['birds', 'Birdsong', 'bird', 'Morning chorus'], ['night', 'Night', 'moon', 'Crickets']
];
const PRESETS = [['Focus', { rain: .55, wind: .15 }], ['Storm', { rain: .7, thunder: .55, wind: .3 }], ['Forest', { birds: .55, stream: .45, wind: .2 }], ['Beach', { waves: .7, birds: .2, wind: .15 }], ['Cabin', { fire: .6, rain: .35 }], ['Night', { night: .55, wind: .15, stream: .2 }]];

let AC = null, MASTER = null, soundsOn = false, sleepAt = 0;

function audio() {
  try {
    if (!AC) {

  return {
    src(kind) { const s = AC.createBufferSource(); s.buffer = noiseBuf(kind); s.loop = true; s.start(0, Math.random() * 4); k.nodes.push(s); return s; },
    osc(type, f) { const o = AC.createOscillator(); o.type = type; o.frequency.value = f; o.start(); k.nodes.push(o); return o; },
    gain(v) { const g = AC.createGain(); g.gain.value = v; return g; },

  };
}
const MAKERS = {
  rain(out, k, m) {
    chain(m.src('pink'), m.filt('highpass', 700), m.gain(.9), out);
    chain(m.src('white'), m.filt('bandpass', 5500, .5), m.gain(.09), out);
  },
  wind(out, k, m) {

    chain(m.osc('sine', .09), m.gain(260), bp.frequency); chain(m.osc('sine', .05), m.gain(.35), g.gain);

  },
  waves(out, k, m) {
    const lp = m.filt('lowpass', 700, .5), g = m.gain(.55), fg = m.gain(.05), lfo = m.osc('sine', .11);
    chain(lfo, m.gain(450), lp.frequency); chain(lfo, m.gain(.45), g.gain); chain(lfo, m.gain(.05), fg.gain);
    chain(m.src('brown'), lp, g, out); chain(m.src('pink'), m.filt('highpass', 1800), fg, out);
  },
  stream(out, k, m) {
    const n = m.src('white');
    [[900, 2.5, 3.1], [1700, 3, 4.4], [3100, 4, 6.3]].forEach(b => { const g = m.gain(.3); chain(m.osc('sine', b[2]), m.gain(.12), g.gain); chain(n, m.filt('bandpass', b[0], b[1]), g, out); });
  },
  fire(out, k, m) {
    chain(m.src('brown'), m.filt('lowpass', 420), m.gain(.75), out);
    const crack = () => {
      if (!AC) return; const t = AC.currentTime, n = AC.createBufferSource(); n.buffer = noiseBuf('white');
      const bp = m.filt('bandpass', 1200 + Math.random() * 3500, 1.5), g = m.gain(0);

    };
    crack();
  },
  thunder(out, k) {
    const rumble = () => {
      if (!AC) return; const t = AC.currentTime, dur = 3 + Math.random() * 3, n = AC.createBufferSource(); n.buffer = noiseBuf('brown');
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180 + Math.random() * 120;

    };
    k.t = setTimeout(rumble, 500);
  },
  birds(out, k) {
    const chirp = () => {
      if (!AC) return; const t0 = AC.currentTime, notes = 1 + Math.floor(Math.random() * 4), base = 2200 + Math.random() * 2400, sp = .07 + Math.random() * .08, up = Math.random() < .5;
      for (let i = 0; i < notes; i++) {
        const t = t0 + i * sp * 1.6, f = base * (1 + Math.random() * .15), o = AC.createOscillator(), g = AC.createGain();

  },
  night(out, k, m) {

      const a = m.gain(.5), e = m.gain(.5);

};
const levelGain = id => Math.pow(S.sounds.levels[id] || 0, 2) * (TRIM[id] || 1);

ACT.sndLvl = el => {
  const id = el.dataset.id, v = +el.value; setLevel(id, v); if (v > 0 && !soundsOn) soundsPlay();
  const c = el.closest('.snd'); if (c) c.classList.toggle('on', v > 0); VIEWS.sounds.paintCtl();
};
ACT.sndMaster = el => { S.sounds.master = +el.value; save(); if (MASTER) MASTER.gain.setTargetAtTime(S.sounds.master, AC.currentTime, .05); };
ACT.sndSleep = el => { const m = +el.value; sleepAt = m ? Date.now() + m * 60000 : 0; if (m && !soundsPlaying()) toast('The timer starts once the mix is playing'); VIEWS.sounds.paintCtl(); };
ACT.sndPreset = el => { const p = PRESETS.find(x => x[0] === el.dataset.p); if (!p) return; S.sounds.levels = {}; Object.assign(S.sounds.levels, p[1]); save(); Object.keys(ENG).forEach(id => { if (!(S.sounds.levels[id] > 0)) stopSound(id); }); soundsPlay(); rerender(); toast(p[0] + ' mix on'); };
ACT.sndClear = () => { S.sounds.levels = {}; save(); soundsPause(); rerender(); };

/* ---- js10-grades ---- */
/* ================= grade calculator ================= */
const SCALES = {
  au: { label: 'HD / D / C / P', bands: [[85, 'HD'], [75, 'D'], [65, 'C'], [50, 'P'], [0, 'F']] },
  us: { label: 'A – F', bands: [[90, 'A'], [80, 'B'], [70, 'C'], [60, 'D'], [0, 'F']] },
  pct: { label: 'Percent', bands: null }
};
function letterFor(p) { const sc = SCALES[S.grades.scale] || SCALES.au; if (!sc.bands || p == null) return '–'; for (const b of sc.bands) if (p >= b[0] - 1e-9) return b[1]; return 'F'; }
const grCourse = () => S.grades.courses.find(c => c.id === S.grades.sel) || null;
const hasScore = i => i.score !== '' && i.score != null && !isNaN(+i.score) && +i.max > 0;
function grCalc(c) {
  let earned = 0, done = 0, total = 0;
  c.items.forEach(i => { const w = Math.max(0, +i.weight || 0); total += w; if (hasScore(i)) { earned += (+i.score / +i.max) * w; done += w; } });
  const target = +c.target || 0, rest = Math.max(0, 100 - done);
  return { earned, done, total, cur: done > 0 ? earned / done * 100 : null, rest, target, need: rest > 0 ? (target - earned) / rest * 100 : null, maxPossible: earned + rest };
}
const f1 = n => (Math.round(n * 10) / 10).toString();
function grSummaryHTML(c) {
  const k = grCalc(c); let needBig, needSub;
  if (k.rest <= 0) { needBig = k.earned >= k.target ? 'Reached' : 'Missed'; needSub = 'All marked. Final: ' + f1(k.earned) + '%'; }
  else if (k.need <= 0) { needBig = 'Secured'; needSub = 'Target ' + f1(k.target) + '% is already safe'; }
  else if (k.need > 100) { needBig = 'Out of reach'; needSub = 'Best possible is ' + f1(k.maxPossible) + '%'; }
  else { needBig = f1(k.need) + '%'; needSub = 'average needed on the last ' + f1(k.rest) + '% to reach ' + f1(k.target) + '%'; }
  return '<div class="box"><span class="eyebrow">Current average</span><div class="big">' + (k.cur == null ? '–' : f1(k.cur) + '%') + '</div><div class="faint" style="font-size:12.5px;margin-top:6px">' + (k.cur == null ? 'Add a score to begin' : 'of the work marked so far') + '</div></div>' +
    '<div class="box"><span class="eyebrow">Grade</span><div class="big">' + letterFor(k.cur) + '</div><div class="faint" style="font-size:12.5px;margin-top:6px">' + (SCALES[S.grades.scale] || SCALES.au).label + '</div></div>' +
    '<div class="box"><span class="eyebrow">Marked so far</span><div class="big">' + f1(k.done) + '%</div><div class="faint" style="font-size:12.5px;margin-top:6px">' + (k.total > 100.0001 ? 'Weights add to ' + f1(k.total) + '%. Check them.' : 'of the course weight') + '</div></div>' +
    '<div class="box"><span class="eyebrow">Needed for ' + f1(k.target) + '%</span><div class="big" style="font-size:' + (needBig.length > 7 ? 30 : 42) + 'px;padding-top:' + (needBig.length > 7 ? 8 : 0) + 'px">' + needBig + '</div><div class="faint" style="font-size:12.5px;margin-top:6px">' + needSub + '</div></div>';
}
function grRowHTML(i) {
  const p = hasScore(i) ? f1(+i.score / +i.max * 100) + '%' : '–';
  return '<div style="display:contents" data-row="' + i.id + '"><input type="text" maxlength="40" value="' + esc(i.name) + '" placeholder="Assessment" data-input="grRow" data-f="name" aria-label="Assessment name">' +
    '<input type="number" step="any" min="0" value="' + esc(i.score) + '" placeholder="–" data-input="grRow" data-f="score" aria-label="Score">' +
    '<input type="number" step="any" min="0" value="' + esc(i.max) + '" data-input="grRow" data-f="max" aria-label="Out of">' +
    '<input type="number" step="any" min="0" max="100" value="' + esc(i.weight) + '" placeholder="0" data-input="grRow" data-f="weight" aria-label="Weight percent">' +
    '<span class="res" data-res>' + p + '</span><button class="ibtn" data-a="grDelRow" data-id="' + i.id + '" aria-label="Delete assessment">' + ic('x', 'sm') + '</button></div>';
}
VIEWS.grades = {
  render(el) {
    const g = S.grades; if (!grCourse() && g.courses.length) g.sel = g.courses[0].id;
    const c = grCourse();
    el.innerHTML = '<div class="page-head"><div><h1>Grades</h1><p>Enter your marks and weights to see where you stand and what you need next.</p></div>' +
      '<div class="seg" role="group" aria-label="Grading scale">' + Object.keys(SCALES).map(k => '<button data-a="grScale" data-s="' + k + '" aria-pressed="' + (g.scale === k) + '">' + SCALES[k].label + '</button>').join('') + '</div></div>' +
      '<div class="gr-tabs">' + g.courses.map(x => '<button class="sbtn" data-a="grSel" data-id="' + x.id + '" aria-pressed="' + (x.id === g.sel) + '">' + esc(x.name || 'Untitled') + '</button>').join('') + '<button class="btn" data-a="grAddCourse">' + ic('plus', 'sm') + ' Add course</button></div>' +
      (c ? '<div class="card"><div class="row wrap sp" style="margin-bottom:18px;gap:16px"><input type="text" class="title-in" maxlength="40" value="' + esc(c.name) + '" placeholder="Course name" data-input="grName" aria-label="Course name" style="flex:1;min-width:180px;width:auto;font-family:var(--serif);font-size:30px;border:0;border-bottom:1px solid var(--line2);border-radius:0;box-shadow:none">' +
        '<label class="f" style="width:130px">Target grade (%)<input type="number" min="0" max="100" step="any" value="' + esc(c.target) + '" data-input="grTarget" aria-label="Target grade percent"></label>' +
        '<button class="btn" id="gr-delc" data-a="grDelCourse">' + ic('trash', 'sm') + ' Delete course</button></div>' +
        '<div class="scroll-x"><div class="gr-table"><span class="h">Assessment</span><span class="h">Score</span><span class="h">Out of</span><span class="h">Weight %</span><span class="h rh" style="text-align:right">Result</span><span></span>' + c.items.map(grRowHTML).join('') + '</div></div>' +
        '<div style="margin-top:14px"><button class="btn" data-a="grAddRow">' + ic('plus', 'sm') + ' Add assessment</button></div>' +
        '<div class="sum" id="gr-sum">' + grSummaryHTML(c) + '</div></div>'
        : '<div class="empty" style="padding:44px 16px"><p style="margin-bottom:14px">No courses yet. Add one to start calculating.</p><button class="btn solid" data-a="grAddCourse">' + ic('plus', 'sm') + ' Add your first course</button></div>');
  }
};
const newItem = (name, w) => ({ id: uid(), name: name || '', score: '', max: 100, weight: w == null ? '' : w });
ACT.grScale = el => { S.grades.scale = el.dataset.s; save(); rerender(); };
ACT.grSel = el => { S.grades.sel = el.dataset.id; save(); rerender(); };
ACT.grAddCourse = () => {
  const c = { id: uid(), name: 'Course ' + (S.grades.courses.length + 1), target: 75, items: [newItem('Assignment 1', 20), newItem('Midterm', 30), newItem('Final exam', 50)] };
  S.grades.courses.push(c); S.grades.sel = c.id; save(); rerender();
  const n = $('[data-input="grName"]'); if (n) { n.focus(); n.select(); }
};
ACT.grDelCourse = el => {
  if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Click again to delete'; setTimeout(() => { if (el.isConnected && cur === 'grades') rerender(); }, 2600); return; }
  S.grades.courses = S.grades.courses.filter(c => c.id !== S.grades.sel); S.grades.sel = S.grades.courses[0] ? S.grades.courses[0].id : ''; save(); rerender();
};
ACT.grAddRow = () => { const c = grCourse(); if (!c) return; c.items.push(newItem('')); save(); rerender(); const ins = $$('[data-f="name"]'); if (ins.length) ins[ins.length - 1].focus(); };
ACT.grDelRow = el => { const c = grCourse(); if (!c) return; c.items = c.items.filter(i => i.id !== el.dataset.id); save(); rerender(); };
ACT.grName = el => { const c = grCourse(); if (!c) return; c.name = el.value.slice(0, 40); save(); const b = $('.gr-tabs .sbtn[aria-pressed="true"]'); if (b) b.textContent = c.name || 'Untitled'; };
ACT.grTarget = el => { const c = grCourse(); if (!c) return; c.target = el.value === '' ? '' : clamp(+el.value, 0, 100); save(); const s = $('#gr-sum'); if (s) s.innerHTML = grSummaryHTML(c); };
ACT.grRow = el => {
  const c = grCourse(); if (!c) return; const row = el.closest('[data-row]'), it = c.items.find(i => i.id === row.dataset.row); if (!it) return;
  const f = el.dataset.f; it[f] = f === 'name' ? el.value : el.value; save();
  const r = row.querySelector('[data-res]'); if (r) r.textContent = hasScore(it) ? f1(+it.score / +it.max * 100) + '%' : '–';
  const s = $('#gr-sum'); if (s) s.innerHTML = grSummaryHTML(c);
};

/* ---- js11-boot ---- */
/* ================= boot ================= */
function tickAll() {
  try { timerTick(); } catch (e) { console.error(e); }
  try { soundsTick(); } catch (e) { }
  const v = VIEWS[cur]; if (v && v.tick) { try { v.tick(); } catch (e) { console.error(e); } }
  try { updateMini(); } catch (e) { }
}
function settleTimerOnLoad() {
  const t = S.timer; if (!t.running) return;
  if (Date.now() - t.lastTick > 120000) {            // the page was closed for a while: pause rather than guess
    t.running = false; if (t.mode === 'pomodoro') t.remaining = Math.max(0, t.phaseEndsAt - t.lastTick);
  } else t.lastTick = Math.max(t.lastTick, Date.now() - 120000);
}
async function boot() {
  load(); settleTimerOnLoad(); applyTheme(); buildNav(); paintMe();
  const hash = (location.hash || '').replace('#', ''); go(VIEWS[hash] ? hash : 'home', true);
  setInterval(tickAll, 500);
  window.addEventListener('pagehide', () => { try { cloud.push(); } catch (e) { } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { try { cloud.push(); } catch (e) { } } else tickAll(); });
  const online = (async () => { await cloud.init(); const changed = await cloud.pull(); if (changed) { applyTheme(); paintMe(); settleTimerOnLoad(); rerender(); } await groupInit(); })();
  if (!S.name) {
    await Promise.race([online, sleep(1800)]);          // a returning person on a new device may already have a name saved
    if (!S.name) showWelcome();
  }
  online.catch(() => { });
}
boot();
